[package]
name = "jarvis"
version = "0.2.0"
edition = "2021"
authors = ["binoymanoj <binoypm2002@gmail.com>"]
description = "Jarvis - Ultra-low-latency, zero-cost AI desktop voice assistant in Rust"

[dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }
async-trait = "0.1"

# CLI Parsing
clap = { version = "4.5", features = ["derive"] }

# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"

# Error Handling & Logging
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP & Web
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
urlencoding = "2.1"
base64 = "0.22"
which = "7.0"
hound = "3.5"
cpal = "0.15"
ort = { version = "2.0.0-rc.13", features = ["download-binaries"] }
ndarray = "0.17"
nix = { version = "0.29", features = ["signal", "process", "user"] }
tempfile = "3.17"
msedge-tts = { version = "0.4.0", default-features = false, features = ["tokio-runtime"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
