[project]
name = "jarvis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "binoymanoj", email = "binoypm2002@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "edge-tts>=7.2.8",
    "google-genai>=2.22.0",
    "groq>=1.7.0",
    "numpy>=2.5.3",
    "openwakeword>=0.4.0",
    "pillow>=12.3.0",
    "piper-tts>=1.8.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
]

[project.scripts]
jarvis = "jarvis:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
